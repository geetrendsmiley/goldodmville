<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Contact Us | ODM Ville Int</title>
    <link rel="icon" type="image/webp" href="images/odm-favicon-48.webp" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <section class="banner"><h1>Contact Us</h1></section>
    <section class="sec contact-enquiry">
      <div class="wrap split">
        <div>
          <h2>Let’s talk about your next project</h2>
          <p>
            Tell us about your enquiry and our team will be in touch.<br /><br />
            ODM Ville International<br />Lagos, Nigeria<br />+234 813 226
            3555<br />info@odmvilleagency.com
          </p>
        </div>
        <form id="contact-form" action="form-handler.php" method="post">
          <input type="hidden" name="form_type" value="contact" /><input
            type="hidden"
            name="return_to"
            value="contact-us.html"
          /><label class="sr-only" aria-hidden="true" hidden
            >Leave this field empty<input
              name="website"
              type="text"
              tabindex="-1"
              autocomplete="off" /></label
          ><input
            name="name"
            autocomplete="name"
            placeholder="Full name"
            required
          /><input
            name="email"
            type="email"
            autocomplete="email"
            placeholder="Email"
            required
          /><input
            name="phone"
            type="tel"
            autocomplete="tel"
            placeholder="Phone"
          /><textarea name="message" placeholder="Message" required></textarea
          ><button class="btn">Send Message</button>
        </form>
        <p
          id="contact-status"
          data-form-status="contact"
          role="status"
          aria-live="polite"
        ></p>
      </div>
    </section>
    <script src="js/script.js"></script>
  </body>
</html>
