<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Work With Us | ODM Ville Int</title>
    <link rel="icon" type="image/webp" href="images/odm-favicon-48.webp" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <section class="banner"><h1>Work With Us</h1></section>
    <section class="sec">
      <div class="wrap" style="max-width: 640px">
        <form id="work-with-us-form" action="form-handler.php" method="post">
          <input type="hidden" name="form_type" value="work_with_us" /><input
            type="hidden"
            name="return_to"
            value="work-with-us.html"
          /><label class="sr-only" aria-hidden="true" hidden
            >Leave this field empty<input
              name="website"
              type="text"
              tabindex="-1"
              autocomplete="off" /></label
          ><input
            name="name"
            autocomplete="name"
            placeholder="Full name"
            required
          /><input
            name="email"
            type="email"
            autocomplete="email"
            placeholder="Email address"
            required
          /><input
            name="phone"
            type="tel"
            autocomplete="tel"
            placeholder="Phone number"
            required
          /><select name="service">
            <option>Campaign management</option>
            <option>Poster Ads and Billboards</option>
            <option>Influencer Marketing and UGC Campaign</option>
            <option>Social Media Engagement drives</option>
            <option>Wikipedia profile creation</option>
            <option>Online publications</option>
            <option>Press conference</option>
            <option>Traditional Media</option></select
          ><input name="date" type="date" /><input
            name="time"
            type="time"
          /><textarea
            name="project"
            placeholder="Describe your project"
          ></textarea
          ><button class="btn">Submit Work With Us Request</button>
        </form>
        <p
          id="work-with-us-status"
          data-form-status="work_with_us"
          role="status"
          aria-live="polite"
        ></p>
      </div>
    </section>
    <script src="js/script.js"></script>
  </body>
</html>
